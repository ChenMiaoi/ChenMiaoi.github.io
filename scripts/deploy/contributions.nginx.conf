# Include inside the existing HTTPS server block for nyachen.cn.
location ^~ /runtime/ { return 404; }
location = /contributions.json {
    proxy_pass http://127.0.0.1:4336;
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 20s;
    proxy_intercept_errors on;
    error_page 502 503 504 = @contribution_snapshot;
}
location @contribution_snapshot {
    add_header Cache-Control "no-cache, max-age=0" always;
    try_files /contributions.json =503;
}
location = /api/contributions/health {
    proxy_pass http://127.0.0.1:4336;
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    add_header Cache-Control "no-store" always;
}
